name: CI
on:
  push:
    branches:
      - '**'
      - '!main'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
  schedule:
    - cron: '0 0,8,16 * * *' # runs daily at 0,8,16 UTC
permissions:
  contents: read
jobs:
  ci:
    environment: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Verify central dispatch pins stay synchronized
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          workflow = pathlib.Path('.github/workflows/ci.yaml').read_text()
          checkout = re.findall(r'repository: developing-today/code\s+ref: ([0-9a-f]{40})\s+path: \.pm-central', workflow)
          action = re.findall(r'uses: developing-today/code/\.github/actions/pm-dispatch-ci-fix@([0-9a-f]{40})', workflow)
          if len(checkout) != 1 or len(action) != 1 or checkout != action:
              raise SystemExit('Update the central checkout and pm-dispatch-ci-fix action pins together')
          PY
      - uses: DeterminateSystems/nix-installer-action@2559b44fed7d4fc978e8dd0e379661afb8b73590
      - uses: DeterminateSystems/magic-nix-cache-action@8941f279e15828abcd2fc8fbb7cd282ab00972a7
      - run: nix build -o ./_site
      - name: Verify configured page-action links
        run: |
          page=./_site/Pages/file.html
          edit_base_url="$(sed -n 's/^  editBaseUrl: //p' index.yaml)"
          new_base_url="$(sed -n 's/^  newBaseUrl: //p' index.yaml)"
          grep -Fq "href='${edit_base_url}/Pages/file.md'" "$page"
          grep -Fq "href='${new_base_url}' aria-label='New Note'" "$page"
          grep -Fq "href='${new_base_url}/Pages/file' aria-label='New Note in Folder'" "$page"
          ! grep -Fq '${value:' "$page"
      - if: inputs.upload-artifact
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
  ci-fix:
    needs: [ci]
    if: failure()
    permissions:
      id-token: write
      issues: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out centralized dispatch action dependencies
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: developing-today/code
          ref: e854869564836b813919c959e9126697a63359dd
          path: .pm-central
      - uses: developing-today/code/.github/actions/pm-dispatch-ci-fix@e854869564836b813919c959e9126697a63359dd
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
