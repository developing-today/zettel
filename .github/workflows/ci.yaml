name: CI
on:
  push:
    branches:
      - '*'
      - '!main'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
  schedule:
    - cron: '0 0,8,16 * * *' # runs daily at 0,8,16 UTC
permissions:
  contents: read
jobs:
  ci:
    environment: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix build -o ./_site
      - name: Verify configured page-action links
        run: |
          page=./_site/Pages/file.html
          edit_base_url="$(sed -n 's/^  editBaseUrl: //p' index.yaml)"
          new_base_url="$(sed -n 's/^  newBaseUrl: //p' index.yaml)"
          grep -Fq "href='${edit_base_url}/Pages/file.md'" "$page"
          grep -Fq "href='${new_base_url}' aria-label='New Note'" "$page"
          grep -Fq "href='${new_base_url}/Pages/file' aria-label='New Note in Folder'" "$page"
          ! grep -Fq '${value:' "$page"
      - if: inputs.upload-artifact
        uses: actions/upload-pages-artifact@main
  ci-fix:
    needs: [ci]
    if: failure()
    permissions:
      id-token: write
      issues: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: developing-today/code/.github/actions/pm-dispatch-ci-fix@main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
